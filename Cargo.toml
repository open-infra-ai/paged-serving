[package]
name = "paged-serving"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
default-run = "paged-serving"
description = "Learning-oriented LLM serving control plane with paged KV scheduling and continuous batching"
authors = ["holtwood"]
license = "MIT"
repository = "https://github.com/open-infra-ai/paged-serving"
homepage = "https://github.com/open-infra-ai/paged-serving"
keywords = ["llm", "inference", "serving", "kv-cache", "scheduler"]
categories = ["development-tools", "simulation"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
# 0.21 提供官方逐步流式 decode 状态机，能在 BPE/byte-fallback 边界安全地增量解码。
tokenizers = "0.21.4"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
async-stream = "0.3"
# loadgen 压测客户端依赖（src/bin/loadgen.rs）：
# rustls 避免对系统 OpenSSL 的依赖，保证 WSL/CI 可复现。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rand = "0.8"

[dev-dependencies]
paged-serving = { path = ".", features = ["test-utils"] }
proptest = "1.11"
criterion = { version = "0.8", features = ["html_reports"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bench]]
name = "engine_benchmark"
harness = false

[[bench]]
name = "concurrency_benchmark"
harness = false

[features]
default = []
# 暴露 src/test_utils.rs 中的测试辅助代码，供集成测试与 bench 使用。
# 经由本 crate 的 dev-dependencies 启用，不会进入正常发布构建。
test-utils = []
# 链接 tiny-llm（C++/CUDA）静态库并启用其 C ABI 符号。
# 需先完成 tiny_llm_ffi 模块文档列出的接入前置条件（真实模型端到端验证 + 导出 C ABI）。
tiny-llm = []

[[bin]]
name = "paged-serving"
path = "src/main.rs"

[lib]
name = "paged_serving"
path = "src/lib.rs"
